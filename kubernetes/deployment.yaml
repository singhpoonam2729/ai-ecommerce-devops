
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-ecommerce-app
  namespace: default
  labels:
    app: ai-ecommerce-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ai-ecommerce-app
  template:
    metadata:
      labels:
        app: ai-ecommerce-app
    spec:
      containers:
        - name: application
          image: 927777211904.dkr.ecr.ap-south-1.amazonaws.com/ai-ecommerce-app:1.0.4
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
